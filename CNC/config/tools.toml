# Fraeser-Bibliothek. Presets je Material stammen aus der Lab-Checkliste
# ("Vorschlaege Parameter fuer Fraeswerkzeuge"). flute_length ist NICHT aus
# der Checkliste: typischer Wert, bitte am echten Fraeser nachmessen.
#
# Felder: type = "flat" | "ball" | "vbit"; diameter, flute_length in mm;
# preset: rpm, feed (mm/min), plunge (mm/min), stepdown (mm).

[flat-2mm-2f]
type = "flat"
diameter = 2.0
flutes = 2
flute_length = 8.0
presets.holz = { rpm = 24000, feed = 500, plunge = 200, stepdown = 2.0 }

[flat-4mm-2f]
type = "flat"
diameter = 4.0
flutes = 2
flute_length = 12.0
presets.holz = { rpm = 24000, feed = 1000, plunge = 300, stepdown = 4.0 }

